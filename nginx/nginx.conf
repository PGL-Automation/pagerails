# PageRails — Nginx reverse proxy
# Replace YOUR_DOMAIN with the actual domain (e.g. recon.pagecapital.ng)

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 110M;     # large enough for bank statement uploads

    # Rate limiting — protects login endpoint
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Redirect HTTP → HTTPS ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name YOUR_DOMAIN;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS main server ──────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name YOUR_DOMAIN;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options           DENY                always;
        add_header X-Content-Type-Options    nosniff             always;
        add_header Referrer-Policy           strict-origin       always;

        # ── /api/* → FastAPI backend ──────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Rate-limit the auth endpoint specifically
            location /api/auth/ {
                limit_req zone=auth burst=5 nodelay;
                proxy_pass http://backend:8000;
                proxy_set_header Host            $host;
                proxy_set_header X-Real-IP       $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            # Increase timeout for long-running reconciliation runs
            proxy_read_timeout 300s;
        }

        # ── Everything else → Next.js frontend ───────────────────────────────
        location / {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Static asset caching ──────────────────────────────────────────────
        location /_next/static/ {
            proxy_pass       http://frontend:3000;
            proxy_set_header Host $host;
            add_header       Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
