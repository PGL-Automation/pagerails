services:

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # SSL certs live here
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - web

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ""               # empty = relative paths, Nginx routes /api/* to FastAPI
    restart: unless-stopped
    environment:
      - RECON_DB_PATH=/data/recon.db          # Next.js API routes (SSR) read SQLite directly
      - NEXT_INTERNAL_BASE=http://localhost:3000
    volumes:
      - app_data:/data
    networks:
      - web
    expose:
      - "3000"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      - RECON_DB_PATH=/data/recon.db
      - RECON_INPUTS_DIR=/data/inputs
      - RECON_CONFIG_DIR=/app/pcg_recon/config
      - RECON_OUTPUTS_DIR=/data/outputs
      - UPLOAD_DIR=/data/uploads
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-480}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - USERS=${USERS}
    volumes:
      - app_data:/data
    networks:
      - web
    expose:
      - "8000"

volumes:
  app_data:    # persists recon.db, inputs, outputs, uploads across restarts/deploys
  nginx_logs:

networks:
  web:
    driver: bridge
