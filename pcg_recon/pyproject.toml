[project]
name = "pagerails-engine"
version = "0.1.0"
description = "PageRails reconciliation engine"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "pdfplumber>=0.10", "pyyaml>=6", "rapidfuzz>=3", "xlrd>=2"]
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest", "reportlab"]
[project.scripts]
pagerails = "pcg_recon.cli:main"
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["pcg_recon*"]
